name: PADS CI/CD

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: '1.26'

jobs:
  # ─────────────────────────────────────────────────────
  # Job 1: Build & Test
  # ─────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Go modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: coverage
          path: coverage.out

  # ─────────────────────────────────────────────────────
  # Job 2: Integration tests (API + pads-ci)
  # ─────────────────────────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build PADS binaries
        run: go build -o bins/ ./...

      - name: Start PADS API
        env:
          PADS_TOKEN: ${{ secrets.PADS_TOKEN }}
        run: |
          ./bins/evolution-api &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV

          # Wait for API to be ready
          for i in $(seq 1 10); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "API failed to start"
              kill $API_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

      - name: Wait for API to be stable
        run: sleep 2

      - name: Run pads-ci stability check
        env:
          PADS_TOKEN: ${{ secrets.PADS_TOKEN }}
        run: |
          ./bins/pads-ci -token "$PADS_TOKEN"
        continue-on-error: false

      - name: Check API health
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health)
          if [ "$RESPONSE" -ne 200 ]; then
            echo "API health check failed with status $RESPONSE"
            exit 1
          fi
          echo "API health check passed"

      - name: Test /rotate endpoint
        env:
          PADS_TOKEN: ${{ secrets.PADS_TOKEN }}
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:8080/rotate \
            -H "Authorization: Bearer $PADS_TOKEN" \
          )
          if [ "$RESPONSE" -ne 200 ]; then
            echo "/rotate returned status $RESPONSE"
            exit 1
          fi
          echo "/rotate endpoint OK"

      - name: Stop API
        if: always()
        run: |
          kill ${{ env.API_PID }} 2>/dev/null || true
          sleep 1

  # ─────────────────────────────────────────────────────
  # Job 3: Conditional deploy (main branch only)
  # ─────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://pads.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build for deployment
        run: |
          echo "Build complete"
          go build -o bins/ ./...
          echo "bins/evolution-api size: $(du -sh bins/evolution-api | cut -f1)"

      - name: Deploy (simulated)
        run: |
          echo "--- DEPLOY SIMULATION ---"
          echo "In a real deployment, you would:"
          echo "  1. Upload bins/evolution-api to your server"
          echo "  2. Restart the systemd service"
          echo "  3. Run health checks"
          echo "  4. Notify on Slack/Teams"
          echo "--- END DEPLOY SIMULATION ---"
          echo "Deploy triggered on: $(date -u)"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"