name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - run: go mod tidy
      - run: go build ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: gofmt -l . | wc -l | xargs -I {} test {} -eq 0
