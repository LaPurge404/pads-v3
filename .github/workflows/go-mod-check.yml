name: Go Module Cleanliness Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-mod-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run go mod tidy
        run: go mod tidy

      - name: Verify no changes in go.mod/go.sum
        run: |
          git diff --exit-code go.mod go.sum